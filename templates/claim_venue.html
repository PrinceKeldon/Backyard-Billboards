{% extends "base.html" %}

{% block title %}Claim Your Venue - Happy Hour Hub{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-header bg-success text-white">
                    <h3 class="mb-0">Claim Your Business</h3>
                </div>
                <div class="card-body">
                    <p class="text-muted">Search for your venue in our directory to take ownership and manage your deals.</p>
                    <form method="POST">
                        <div class="mb-3">
                            <label for="business_name" class="form-label">Exact Business Name</label>
                            <input type="text" class="form-control" id="business_name" name="business_name" placeholder="e.g. The Tipsy Parrot" required>
                        </div>
                        <div class="d-grid">
                            <button type="submit" class="btn btn-success btn-lg">Claim Venue</button>
                        </div>
                    </form>
                </div>
            </div>
            <div class="text-center mt-4">
                <p>Can't find your venue? <a href="{{ url_for('submit_deal') }}">Submit it here</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
